events {
  worker_connections 4096;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream websocket_nodes {
    least_conn;
    server ws1:8080 max_fails=3 fail_timeout=15s;
    server ws2:8080 max_fails=3 fail_timeout=15s;
  }

  upstream app_nodes {
    server app:3000 max_fails=3 fail_timeout=15s;
  }

  server {
    listen 80;
    server_name _;

    location /healthz {
      return 200 '{"ok":true,"service":"nginx"}';
      add_header Content-Type application/json;
    }

    location /ws/ {
      proxy_pass http://websocket_nodes/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
    }

    location / {
      proxy_pass http://app_nodes;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
