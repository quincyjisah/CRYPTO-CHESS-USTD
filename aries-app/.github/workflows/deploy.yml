# .github/workflows/deploy.yml
# Aries Protocol — Production CI/CD Pipeline
#
# Triggers:
#   Push to main   → deploy to production
#   Push to staging → deploy to staging
#   Pull request   → run tests only
#
# Steps:
#   1. Type-check TypeScript
#   2. Run unit tests
#   3. Build Docker images
#   4. Push to Google Container Registry
#   5. Deploy to Kubernetes via kubectl
#   6. Run post-deploy smoke tests
#   7. Notify on failure

name: Aries Protocol CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  PROJECT_ID:   ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER:  aries-production
  GKE_ZONE:     us-central1
  IMAGE_WS:     gcr.io/${{ secrets.GCP_PROJECT_ID }}/ws
  IMAGE_MM:     gcr.io/${{ secrets.GCP_PROJECT_ID }}/matchmaker
  IMAGE_AC:     gcr.io/${{ secrets.GCP_PROJECT_ID }}/anticheat

jobs:
  # ─── 1. Type check and tests ────────────────────────────────────────────────
  test:
    name: Test & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: TypeScript type check
        run: cd backend && npm run lint

      - name: Run unit tests
        run: cd backend && npm test

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend type check
        run: npm run type-check

      - name: Frontend build check
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY:        fake_key
          VITE_FIREBASE_PROJECT_ID:     fake-project
          VITE_FIREBASE_APP_ID:         fake-app-id
          VITE_FIREBASE_AUTH_DOMAIN:    fake.firebaseapp.com
          VITE_FIREBASE_STORAGE_BUCKET: fake.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123"
          VITE_ALCHEMY_API_KEY:         fake_alchemy_key
          VITE_ADSENSE_PUB_ID:          ca-pub-fake
          VITE_WALLETCONNECT_PROJECT_ID: fake_wc_id
          VITE_TREASURY_ADDRESS:        "0x0000000000000000000000000000000000000000"

  # ─── 2. Security scan ───────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan on Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend/'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Audit npm dependencies
        run: |
          npm audit --audit-level=critical
          cd backend && npm audit --audit-level=critical

  # ─── 3. Build and push Docker images ────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push'
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Set image tag
        id: meta
        run: echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build WebSocket server image
        run: |
          docker build \
            -f backend/docker/Dockerfile.ws \
            -t $IMAGE_WS:${{ steps.meta.outputs.version }} \
            -t $IMAGE_WS:latest \
            --cache-from $IMAGE_WS:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            backend/

      - name: Push WebSocket server image
        run: |
          docker push $IMAGE_WS:${{ steps.meta.outputs.version }}
          docker push $IMAGE_WS:latest

      - name: Build Matchmaker image
        run: |
          docker build \
            -f backend/docker/Dockerfile.matchmaker \
            -t $IMAGE_MM:${{ steps.meta.outputs.version }} \
            -t $IMAGE_MM:latest \
            backend/

      - name: Push Matchmaker image
        run: |
          docker push $IMAGE_MM:${{ steps.meta.outputs.version }}
          docker push $IMAGE_MM:latest

  # ─── 4. Deploy to Kubernetes ─────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location:     ${{ env.GKE_ZONE }}

      - name: Update Kubernetes secrets
        run: |
          kubectl create secret generic aries-secrets \
            --namespace aries-protocol \
            --from-literal=redis-url=${{ secrets.REDIS_URL }} \
            --from-literal=firebase-api-key=${{ secrets.FIREBASE_API_KEY }} \
            --from-literal=jwt-secret=${{ secrets.JWT_SECRET }} \
            --from-literal=alchemy-rpc=${{ secrets.ALCHEMY_RPC }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f backend/k8s/manifests.yaml

      - name: Update WebSocket deployment image
        run: |
          kubectl set image deployment/aries-ws \
            ws=$IMAGE_WS:${{ needs.build.outputs.image-tag }} \
            --namespace aries-protocol

      - name: Update Matchmaker deployment image
        run: |
          kubectl set image deployment/aries-matchmaker \
            matchmaker=$IMAGE_MM:${{ needs.build.outputs.image-tag }} \
            --namespace aries-protocol

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/aries-ws \
            --namespace aries-protocol \
            --timeout=5m
          kubectl rollout status deployment/aries-matchmaker \
            --namespace aries-protocol \
            --timeout=5m

      - name: Deploy Firebase (Firestore rules + functions + hosting)
        run: |
          npm install -g firebase-tools
          firebase deploy \
            --only firestore:rules,firestore:indexes,functions,hosting \
            --project ${{ secrets.FIREBASE_PROJECT_ID }} \
            --token ${{ secrets.FIREBASE_TOKEN }}

      - name: Post-deploy smoke test
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ws.ariesprotocol.app/health)
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: /health returned $STATUS"
            exit 1
          fi
          echo "Smoke test passed"

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 Aries Protocol production deploy FAILED\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ─── 5. Deploy to Staging ────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_STAGING }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: aries-staging
          location:     ${{ env.GKE_ZONE }}

      - name: Deploy to staging namespace
        run: |
          kubectl set image deployment/aries-ws \
            ws=$IMAGE_WS:${{ needs.build.outputs.image-tag }} \
            --namespace aries-staging
          kubectl rollout status deployment/aries-ws \
            --namespace aries-staging \
            --timeout=3m
