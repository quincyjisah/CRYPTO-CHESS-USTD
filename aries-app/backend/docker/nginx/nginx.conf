# nginx/nginx.conf — Aries Protocol Production NGINX
# WebSocket sticky sessions via IP hash
# Rate limiting: 10 req/s per IP, burst 20
# WebSocket connections: 50k per node

worker_processes      auto;
worker_rlimit_nofile  100000;

events {
  worker_connections  65535;
  multi_accept        on;
  use                 epoll;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  # Logging
  log_format json_combined escape=json
    '{"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":"$status",'
    '"bytes":"$body_bytes_sent",'
    '"upstream":"$upstream_addr",'
    '"response_time":"$upstream_response_time"}';

  access_log /var/log/nginx/access.log json_combined;
  error_log  /var/log/nginx/error.log warn;

  # Performance
  sendfile          on;
  tcp_nopush        on;
  tcp_nodelay       on;
  keepalive_timeout 65;
  gzip              on;
  gzip_comp_level   6;
  gzip_types        text/plain application/json application/javascript text/css;

  # Security headers
  add_header X-Frame-Options           "DENY"              always;
  add_header X-Content-Type-Options    "nosniff"           always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

  # Rate limiting zones
  limit_req_zone  $binary_remote_addr zone=api:10m  rate=10r/s;
  limit_req_zone  $binary_remote_addr zone=ws:10m   rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=addr:10m;

  # WebSocket upstream — sticky by IP hash for reconnects
  upstream ws_cluster {
    ip_hash;
    server ws:8080 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 1000;
  }

  # Health check upstream
  upstream health_cluster {
    least_conn;
    server ws:8080;
  }

  # Main server
  server {
    listen      80;
    server_name _;

    # Redirect HTTP → HTTPS in production
    # return 301 https://$host$request_uri;

    # ── WebSocket endpoint ────────────────────────────────────────────────
    location /ws {
      limit_req  zone=ws  burst=10 nodelay;
      limit_conn addr 5;   # Max 5 WS connections per IP (multi-tab)

      proxy_pass         http://ws_cluster;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "Upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

      # WebSocket timeout — 60s ping interval, 90s read timeout
      proxy_read_timeout    90s;
      proxy_send_timeout    90s;
      proxy_connect_timeout 10s;

      # Large buffers for game state messages
      proxy_buffer_size   64k;
      proxy_buffers       8 64k;
    }

    # ── REST API ──────────────────────────────────────────────────────────
    location /api/ {
      limit_req  zone=api burst=20 nodelay;
      limit_conn addr 20;

      proxy_pass       http://ws_cluster;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # ── Health check ──────────────────────────────────────────────────────
    location /health {
      proxy_pass http://health_cluster;
      access_log off;
    }

    # ── Metrics (internal only) ───────────────────────────────────────────
    location /metrics {
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      deny  all;
      proxy_pass http://ws_cluster;
    }

    # ── Block common exploit paths ────────────────────────────────────────
    location ~* \.(env|git|sql|bak|log)$ { return 404; }
    location ~ /\. { return 404; }
  }
}
