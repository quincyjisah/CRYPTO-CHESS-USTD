# backend/docker/monitoring/prometheus.yml
# Aries Protocol — Prometheus scrape configuration

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: aries-production
    region:  us-central1

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # WebSocket nodes
  - job_name: aries-ws
    static_configs:
      - targets: ["ws:8080"]
    metrics_path: /metrics
    scrape_interval: 10s

  # Matchmaker
  - job_name: aries-matchmaker
    static_configs:
      - targets: ["matchmaker:8081"]
    metrics_path: /metrics

  # Redis exporter
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # NGINX exporter
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Kubernetes pods (auto-discovery via annotations)
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["aries-protocol"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
