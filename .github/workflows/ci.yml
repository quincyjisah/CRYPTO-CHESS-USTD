name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies (Node)
        if: filesExists('package.json')
        run: |
          npm ci || npm install

      - name: ESLint
        if: filesExists('package.json') && hash npm 2>/dev/null && npm run | grep -q "lint" || true
        run: |
          if npx -c 'npx eslint --version' 2>/dev/null; then
            npx eslint .
          else
            echo "ESLint not configured; skipping lint step"
          fi

      - name: Run tests (Node)
        if: filesExists('package.json')
        run: |
          if npm run | grep -q "test"; then
            npm test --silent
          else
            echo "No test script found in package.json"
          fi

      - name: Run Python checks
        if: filesExists('pyproject.toml') || filesExists('requirements.txt')
        uses: actions/setup-python@v4

      - name: Attempt Docker build
        if: filesExists('Dockerfile')
        run: |
          docker build -t local-test-image:ci-test . || true

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ./

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install
        run: npm ci || npm install
        if: filesExists('package.json')

      - name: Run tests with coverage
        run: npm test --silent -- --coverage
        if: filesExists('package.json')

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
